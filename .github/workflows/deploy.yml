# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # When you connect claudeandvscode.com, change this to '/'.
      - run: npm run build
        env:
          BASE_PATH: /claudeandvscode/

      # Give each page its own copy of the app so /about and /contact load
      # properly (status 200) when refreshed or opened directly. 404.html
      # catches any other address and shows the home page.
      - run: |
          for page in about contact; do
            mkdir -p dist/$page
            cp dist/index.html dist/$page/index.html
          done
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
